        text-transform: uppercase;
        letter-spacing: 0.04em;

        padding: 0;
        margin: 0;
        list-style: none;

      .card {
        display: block;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .card .card-title {
        display: block;
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent);
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      footer {
        max-width: 860px;
        margin: 56px auto 0;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        color: var(--muted);

      function createCardList(notes) {
        const list = document.createElement("ul");
        list.className = "cards";

        for (const note of notes) {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "card";
          link.href = note.href;

          const heading = document.createElement("span");
          heading.className = "card-title";
          heading.textContent = note.title;

          const description = document.createElement("p");
          description.textContent = note.description;

          link.append(heading, description);
          item.append(link);
          list.append(item);
        }

        return list;
      }

      const container = document.getElementById("notes");

        const wrapper = document.createElement("section");
        wrapper.className = "section";

        const heading = document.createElement("h2");
        heading.textContent = section.title;
        wrapper.append(heading);

        if (section.notes?.length) {
          wrapper.append(createCardList(section.notes));
        }

        for (const subsection of section.subsections ?? []) {
          const subWrapper = document.createElement("div");
          subWrapper.className = "subsection";

          const subHeading = document.createElement("h3");
          subHeading.textContent = subsection.title;

          subWrapper.append(subHeading, createCardList(subsection.notes));
          wrapper.append(subWrapper);
        }

        container.append(wrapper);
